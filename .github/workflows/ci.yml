name: Classroom Response Ranking CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: classroom-response-ranking-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify source and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      CLASSROOM_ENVIRONMENT: development
      CLASSROOM_LOCAL_USER_ID: ci-operator
      CLASSROOM_LOCAL_USER_NAME: CI Operator
      CLASSROOM_LOCAL_USER_EMAIL: ci-operator@example.invalid
      CLASSROOM_ADMIN_EMAILS: ci-operator@example.invalid

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Use the project Node.js version
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Verify source, tests, and production bundle
        run: npm run gate:ci

      - name: Preserve the verified build for review
        uses: actions/upload-artifact@v7
        with:
          name: classroom-response-ranking-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7
